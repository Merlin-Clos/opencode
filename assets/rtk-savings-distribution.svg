<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title description">
  <title id="title">RTK profile-level saving rate distribution</title>
  <desc id="description">A box-and-whisker plot for four anonymized profiles. Minimum 29.5 percent, first quartile 37.7 percent, median 47.7 percent, mean 51.0 percent, third quartile 64.4 percent, maximum 79.3 percent. The blue band shows one population standard deviation around the mean, from 32.5 to 69.5 percent.</desc>
  <style>
    .background { fill: #ffffff; }
    .title { fill: #172033; font: 700 20px system-ui, sans-serif; }
    .label { fill: #455065; font: 14px system-ui, sans-serif; }
    .value { fill: #172033; font: 600 13px system-ui, sans-serif; }
    .grid { stroke: #d8dee9; stroke-width: 1; }
    .axis { stroke: #7b879b; stroke-width: 1.5; }
    .whisker { stroke: #172033; stroke-width: 3; }
    .box { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .median { stroke: #dc2626; stroke-width: 4; }
    .mean { fill: #111827; stroke: #ffffff; stroke-width: 2; }
    .sd { fill: #bfdbfe; opacity: 0.65; }
    .legend-line { stroke-width: 3; }
  </style>
  <rect class="background" width="900" height="330" rx="12" />
  <text class="title" x="40" y="38">RTK saving-rate distribution across four profiles</text>

  <line class="grid" x1="80" y1="76" x2="820" y2="76" />
  <line class="grid" x1="80" y1="126" x2="820" y2="126" />
  <line class="grid" x1="80" y1="176" x2="820" y2="176" />
  <line class="grid" x1="80" y1="226" x2="820" y2="226" />
  <line class="axis" x1="80" y1="226" x2="820" y2="226" />

  <text class="label" x="80" y="250" text-anchor="middle">0%</text>
  <text class="label" x="265" y="250" text-anchor="middle">25%</text>
  <text class="label" x="450" y="250" text-anchor="middle">50%</text>
  <text class="label" x="635" y="250" text-anchor="middle">75%</text>
  <text class="label" x="820" y="250" text-anchor="middle">100%</text>

  <rect class="sd" x="320.5" y="139" width="273.8" height="36" rx="8" />
  <line class="whisker" x1="298.3" y1="157" x2="666.8" y2="157" />
  <line class="whisker" x1="298.3" y1="143" x2="298.3" y2="171" />
  <line class="whisker" x1="666.8" y1="143" x2="666.8" y2="171" />
  <rect class="box" x="358.0" y="137" width="198.6" height="40" rx="5" />
  <line class="median" x1="433.0" y1="134" x2="433.0" y2="180" />
  <circle class="mean" cx="457.6" cy="157" r="7" />

  <text class="value" x="298.3" y="124" text-anchor="middle">min 29.5%</text>
  <text class="value" x="358.0" y="205" text-anchor="middle">Q1 37.7%</text>
  <text class="value" x="556.6" y="124" text-anchor="middle">Q3 64.4%</text>
  <text class="value" x="433.0" y="205" text-anchor="middle">median 47.7%</text>
  <text class="value" x="457.6" y="96" text-anchor="middle">mean 51.0%</text>
  <text class="value" x="666.8" y="205" text-anchor="middle">max 79.3%</text>

  <line class="legend-line" stroke="#bfdbfe" x1="100" y1="286" x2="124" y2="286" />
  <text class="label" x="132" y="291">mean ± 1 population SD (18.5 pp)</text>
  <line class="legend-line" stroke="#dc2626" x1="390" y1="286" x2="414" y2="286" />
  <text class="label" x="422" y="291">median</text>
  <circle class="mean" cx="520" cy="286" r="6" />
  <text class="label" x="534" y="291">mean</text>
</svg>
